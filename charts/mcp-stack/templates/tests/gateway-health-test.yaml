apiVersion: v1
kind: Pod
metadata:
  name: gateway-health-test
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:latest
      command:
        - sh
        - -c
        - |
          echo "Testing gateway health..."
          curl -f http://mcp-stack-mcpgateway/health
