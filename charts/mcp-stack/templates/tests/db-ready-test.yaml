apiVersion: v1
kind: Pod
metadata:
  name: db-ready-test
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  containers:
    - name: db-service-check
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "Checking Postgres service discovery..."

          nslookup mcp-stack-postgres.default.svc.cluster.local

          echo "Postgres service is discoverable through Kubernetes DNS"
