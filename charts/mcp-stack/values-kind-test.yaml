# ===================================================================================================
# Values used ONLY for automated Kind-based chart testing
# It is NOT intended for production use
#
# This file disables optional local/demo workloads and external CRD-backed resources
# so the Helm chart can be tested in a clean lightweight, repeatable Kubernetes cluster.
#
# Image pull policies set to IfNotPresent so Kind/CI can reuse cached images
# while still pulling from the registry if an image is not already available
# ===================================================================================================

mcpContextForge:
  replicaCount: 1
  hpa:
    enabled: false
  image:
    repository: ghcr.io/ibm/mcp-context-forge
    tag: "1.0.0-RC-2"
    pullPolicy: IfNotPresent

  ingress:
    enabled: false        # Not needed for in-cluster Helm tests

  metrics:
    enabled: false
    serviceMonitor:       # Disable ServiceMonitor because the CI Kind cluster does not install Prometheus Operator CRDs
      enabled: false


  secret:
    # Dev credentials (match previous deployment)
    BASIC_AUTH_USER: admin
    BASIC_AUTH_PASSWORD: changeme
    JWT_SECRET_KEY: my-test-key
    AUTH_ENCRYPTION_SECRET: my-test-salt
    AUTH_REQUIRED: "true"
    MCP_REQUIRE_AUTH: "true"
    PLATFORM_ADMIN_EMAIL: admin@example.com
    PLATFORM_ADMIN_PASSWORD: changeme
    # Relax password policy for local dev bootstrap
    PASSWORD_REQUIRE_UPPERCASE: "false"
    PASSWORD_REQUIRE_LOWERCASE: "false"
    PASSWORD_REQUIRE_SPECIAL: "false"
    REQUIRE_STRONG_SECRETS: "false"

migration:
  image:
    repository: ghcr.io/ibm/mcp-context-forge
    tag: "1.0.0-RC-2"
    pullPolicy: IfNotPresent


# Core infrastructure — lightweight settings for Kind chart testing
postgres:
  enabled: true
  persistence:
    size: 2Gi
    storageClassName: standard
    useReadWriteOncePod: false
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 256Mi
  credentials:
    database: postgresdb
    user: admin
    password: test123

redis:
  enabled: true


# Disable optional admin/storage tools that are not required for Helm chart validation
pgadmin:
  enabled: false
pgbouncer:
  enabled: false
redisCommander:
  enabled: false
minio:
  enabled: false


# Disable optional demo/test workloads
testing:
  enabled: false
  registration:
    image:
      repository: ghcr.io/ibm/mcp-context-forge
      tag: "1.0.0-RC-2"
      pullPolicy: IfNotPresent
  locust:
    enabled: false     # Outside the Kind chart test scope
  fastTime:
    register:
      enabled: false   # Registration auth/RBAC is outside chart test scope
  fastTestServer:
    enabled: false     # Optional demo server not needed for chart validation
    image:
      pullPolicy: IfNotPresent
  fastTest:
    register:
      enabled: false   # Auto-registration jobs not needed for Helm test validation
  a2aEchoAgent:
    enabled: false     # Not needed for chart validation
