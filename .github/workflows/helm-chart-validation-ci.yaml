# =========================================================================================
#
# Helm Chart Validation CI
#
# Validates the mcp-stack Helm chart by running linting, security checks,
# unit tests, Kind-based deployment tests, chart verification, chart packaging,
# and CI artefact uploads.
#
# =========================================================================================

name: Helm Chart Validation CI

on:
  push:
    branches:
      - main
      - issue-223-helm-chart-test-harness
  pull_request:
    branches:
      - main

jobs:
  helm-chart-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up Kind
        uses: helm/kind-action@v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python test and security tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio pytest-env bandit

      - name: Lint Helm chart
        run: make chart-lint

      - name: Run security checks
        run: make security-check

      - name: Run gateway health Python unit tests
        run: make python-test-gateway-health

      - name: Run Kind-based chart tests
        run: make chart-test-kind

# Pull the chart-verifier image before chart-verify to separate image download issues from chart verification failures
      - name: Pull chart verifier image
        run: docker pull quay.io/redhat-certification/chart-verifier:latest

      - name: Run chart verifier
        run: make chart-verify

      - name: Package Helm chart
        run: make chart-package

      - name: Upload chart verifier report
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart-verifier-report
          path: reports/*.yaml

      - name: Upload Helm chart package
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart-package
          path: dist/*.tgz

      - name: Upload Kubernetes runtime snapshot
        uses: actions/upload-artifact@v4
        with:
          name: kubernetes-runtime-snapshot
          path: reports/kubectl-*.txt
